# Existing certificate renewal uses this HTTP webroot.
limit_req_zone $binary_remote_addr zone=appki_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=appki_auth:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=appki_downloads:1m;

server {
    listen 80 default_server;
    server_name 85.239.144.214;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/happ-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://85.239.144.214$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 85.239.144.214;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/happ-ota-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happ-ota-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    # Bearer installation links must never appear in error logs.
    error_log /dev/null crit;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host 85.239.144.214;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/auth/telegram {
        limit_req zone=appki_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18880;
    }
    location ^~ /api/ {
        limit_req zone=appki_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18880;
    }
    location ^~ /install/ {
        limit_conn appki_downloads 8;
        limit_conn_status 429;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18880;
    }
    location ~ /\. { return 404; }
    location / { proxy_pass http://127.0.0.1:18880; }
}

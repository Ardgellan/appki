[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "appki"
version = "0.1.0"
description = "Telegram storefront with YooKassa payments and private IPA delivery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["appki*"]

[tool.setuptools.package-data]
appki = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
